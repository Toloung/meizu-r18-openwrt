name: Meizu R18 Stage 2 initramfs

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/r18-initramfs.config'
      - 'patches/openwrt-25.12.5/**'
      - '.github/workflows/r18-initramfs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev python3 \
            python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt v25.12.5 and apply R18 board patch
        run: |
          git clone --depth 1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt apply ../patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch

      - name: Configure feeds and Stage 2 initramfs
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../configs/r18-initramfs.config .config
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: Build
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../kernel-build.log

      - name: Create checksums and flashing warning
        if: always()
        run: |
          mkdir -p artifacts
          find openwrt/bin/targets -type f \( -iname '*meizu*r18*initramfs*' -o -iname '*meizu*r18*sysupgrade*' \) -exec cp {} artifacts/ \; || true
          cp openwrt/.config artifacts/.config || true
          cp kernel-build.log artifacts/kernel-build.log || true
          printf '%s\n' 'DO NOT FLASH: any sysupgrade artifact is static-check only.' > artifacts/NOT-FOR-FLASHING.txt
          cd artifacts
          sha256sum * .config > sha256sums 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meizu-r18-stage2-initramfs-and-static-checks
          path: artifacts/
