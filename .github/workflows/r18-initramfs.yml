name: Meizu R18 Stage 2.2 Reboot Fix + Chinese LuCI

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/r18-initramfs.config'
      - 'patches/openwrt-25.12.5/**'
      - '.github/workflows/r18-initramfs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev python3 \
            python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt v25.12.5 and apply R18 board patch
        run: |
          git clone --depth 1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt apply --check ../patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch
          git -C openwrt apply ../patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch
          git -C openwrt diff --check

      - name: Check Stage 2.2 source assertions
        run: |
          set -eu
          network=openwrt/target/linux/ramips/mt76x8/base-files/etc/board.d/02_network
          rescue=openwrt/target/linux/ramips/mt76x8/base-files/etc/init.d/r18-net-rescue
          worker=openwrt/target/linux/ramips/mt76x8/base-files/usr/sbin/r18-net-rescue-worker
          image=openwrt/target/linux/ramips/image/mt76x8.mk
          grep -A5 -F 'meizu,r18)' "$network" | grep -F '"1:lan:1" "3:lan:2" "4:wan" "6@eth0"'
          test -f "$rescue"
          test -f "$worker"
          grep -F 'START=99' "$rescue"
          grep -F 'USE_PROCD=1' "$rescue"
          grep -F 'sleep 60' "$worker"
          grep -F 'R18-OpenWrt-Test' openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/99-r18-wifi-test
          grep -F "network='lan'" openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/99-r18-wifi-test
          grep -F "luci.main.lang='zh_cn'" openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/99-r18-wifi-test
          grep -F 'IMAGE/recovery.bin := append-kernel | append-rootfs | pad-rootfs | check-size' "$image"
          ! grep -E '^  IMAGE/recovery\.bin .*append-metadata' "$image"

      - name: Configure feeds and Stage 2.2 initramfs
        working-directory: openwrt
        run: |
          set -eu
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "===== LuCI feed package search ====="
          for package in \
            luci-i18n-base-zh-cn \
            luci-app-firewall \
            luci-i18n-firewall-zh-cn \
            luci-app-package-manager \
            luci-i18n-package-manager-zh-cn
          do
            if ! result="$(./scripts/feeds search "$package")"; then
              echo "::error::LuCI feed search failed for $package"
              exit 1
            fi
            printf '%s\n' "$result"
            printf '%s\n' "$result" | grep -F "$package" >/dev/null || {
              echo "::error::LuCI feed package $package does not exist in OpenWrt v25.12.5"
              exit 1
            }
          done
          echo "===== End LuCI feed package search ====="
          cp ../configs/r18-initramfs.config .config
          make defconfig
          echo "===== LuCI config after defconfig ====="
          grep -E '^CONFIG_(PACKAGE_luci|LUCI_LANG_zh_Hans)|^# CONFIG_(PACKAGE_luci|LUCI_LANG_zh_Hans)' .config | \
            grep -E '(^CONFIG_PACKAGE_luci=y$|LUCI_LANG_zh_Hans|app-firewall|app-package-manager|base-zh-cn|firewall-zh-cn|package-manager-zh-cn)' || true
          echo "===== End LuCI config ====="
          require_luci_config() {
            if ! grep -Fx "$1" .config; then
              echo "::error::$2 was dropped by make defconfig"
              exit 1
            fi
          }
          require_luci_config 'CONFIG_LUCI_LANG_zh_Hans=y' 'LUCI_LANG_zh_Hans'
          require_luci_config 'CONFIG_PACKAGE_luci=y' 'luci'
          require_luci_config 'CONFIG_PACKAGE_luci-app-firewall=y' 'luci-app-firewall'
          require_luci_config 'CONFIG_PACKAGE_luci-app-package-manager=y' 'luci-app-package-manager'
          require_luci_config 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' 'luci-i18n-base-zh-cn'
          require_luci_config 'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y' 'luci-i18n-firewall-zh-cn'
          require_luci_config 'CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y' 'luci-i18n-package-manager-zh-cn'

      - name: Inject private 2.4 GHz test PSK
        env:
          R18_WIFI_TEST_PSK: ${{ secrets.R18_WIFI_TEST_PSK }}
        run: |
          test -n "$R18_WIFI_TEST_PSK" || { echo 'R18_WIFI_TEST_PSK secret is required'; exit 1; }
          test "${#R18_WIFI_TEST_PSK}" -ge 8 || { echo 'R18_WIFI_TEST_PSK must be at least 8 characters'; exit 1; }
          install -d -m 0755 openwrt/files/etc
          umask 077
          printf '%s\n' "$R18_WIFI_TEST_PSK" > openwrt/files/etc/r18-wifi-test-psk

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: Build
        working-directory: openwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../kernel-build.log

      - name: Verify images and create checksums
        if: always()
        run: |
          set -eu
          mkdir -p artifacts
          test -d openwrt/bin/targets || {
            echo '::error::OpenWrt build output directory does not exist'
            exit 1
          }
          initramfs=$(find openwrt/bin/targets -type f -iname '*meizu*r18*initramfs-kernel.bin' -print -quit)
          sysupgrade=$(find openwrt/bin/targets -type f -iname '*meizu*r18*squashfs-sysupgrade.bin' -print -quit)
          recovery=$(find openwrt/bin/targets -type f -iname '*meizu*r18*squashfs-recovery.bin' -print -quit)
          test -n "$initramfs" || { echo '::error::Missing R18 initramfs-kernel.bin'; exit 1; }
          test -n "$sysupgrade" || { echo '::error::Missing R18 squashfs-sysupgrade.bin'; exit 1; }
          test -n "$recovery" || { echo '::error::Missing R18 squashfs-recovery.bin'; exit 1; }
          cp "$initramfs" "$sysupgrade" "$recovery" artifacts/
          cp "$recovery" artifacts/meizu_r18.bin
          grep -a -q $'\xde\xad\xc0\xde' "$recovery"
          test "$(sha256sum "$recovery" | awk '{print $1}')" = "$(sha256sum artifacts/meizu_r18.bin | awk '{print $1}')"
          cp openwrt/.config artifacts/.config || true
          cp kernel-build.log artifacts/kernel-build.log || true
          printf '%s\n' 'Stage 2.2 Reboot Fix + Chinese LuCI: meizu_r18.bin is a static recovery candidate only; do not use WPS/TFTP recovery or flash it without separately authorised validation.' > artifacts/NOT-FOR-FLASHING.txt
          cd artifacts
          sha256sum * .config > sha256sums 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meizu-r18-stage2.2-reboot-fix-chinese-luci
          path: artifacts/
