name: Meizu R18 Stage 4 RC3 - Bootstrap and Argon

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/r18-initramfs.config'
      - 'patches/openwrt-25.12.5/**'
      - 'scripts/verify_r18_recovery.py'
      - 'scripts/verify_r18_stage24.py'
      - 'scripts/verify_r18_stage25.py'
      - 'scripts/verify_r18_stage3.py'
      - 'scripts/test_r18_healthcheck_parser.sh'
      - 'scripts/test_r18_luci_keep_settings.sh'
      - 'docs/STAGE3_5_UPGRADE_STABILITY.md'
      - 'docs/**'
      - 'themes/r18-luci-themes.lock'
      - '.github/workflows/r18-initramfs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            ccache gcc-multilib gettext git libncurses5-dev libssl-dev python3 \
            python3-setuptools rsync unzip zlib1g-dev file wget patch squashfs-tools

      - name: Prepare OpenWrt 25.12.5
        run: |
          set -eu
          git clone --depth 1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt

      - name: Apply R18 Stage patch
        run: |
          set -eu
          git -C openwrt apply --check ../patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch
          git -C openwrt apply ../patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch
          git -C openwrt diff --check

      - name: Fetch pinned LuCI themes
        run: |
          set -eu
          . themes/r18-luci-themes.lock
          fetch_theme() {
            name="$1"
            source="$2"
            commit="$3"
            directory="$4"
            test ! -e "$directory" || {
              echo "::error::theme directory unexpectedly exists: $directory"
              exit 1
            }
            mkdir -p "$(dirname "$directory")"
            git init -q "$directory"
            git -C "$directory" remote add origin "$source"
            git -C "$directory" fetch --depth=1 origin "$commit"
            git -C "$directory" checkout -q --detach FETCH_HEAD
            actual="$(git -C "$directory" rev-parse HEAD)"
            test "$actual" = "$commit" || {
              echo "::error::$name pin mismatch: expected $commit, got $actual"
              exit 1
            }
            test -f "$directory/Makefile" || {
              echo "::error::$name Makefile is missing"
              exit 1
            }
            echo "[PASS] $name source pinned at $actual"
          }
          fetch_theme Argon "$ARGON_SOURCE" "$ARGON_COMMIT" openwrt/package/r18-luci-themes/luci-theme-argon

      - name: Restore OpenWrt downloads cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-openwrt-v25.12.5-dl-v1
          restore-keys: |
            ${{ runner.os }}-openwrt-v25.12.5-dl-

      - name: Verify R18 source defaults
        run: |
          set -eu
          network=openwrt/target/linux/ramips/mt76x8/base-files/etc/board.d/02_network
          rescue=openwrt/target/linux/ramips/mt76x8/base-files/etc/init.d/r18-net-rescue
          worker=openwrt/target/linux/ramips/mt76x8/base-files/usr/sbin/r18-net-rescue-worker
          keep_luci=openwrt/target/linux/ramips/mt76x8/base-files/lib/upgrade/keep.d/r18-luci
          wifi=openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/99-r18-wifi-defaults
          image=openwrt/target/linux/ramips/image/mt76x8.mk
          argon=openwrt/package/r18-luci-themes/luci-theme-argon/Makefile
          check_fixed() {
            desc="$1"
            pattern="$2"
            file="$3"
            if ! grep -Fq -- "$pattern" "$file"; then
              echo "::error::$desc"
              echo "pattern: $pattern"
              echo "file: $file"
              echo "reason: required content is absent"
              exit 1
            fi
            echo "[PASS] $desc"
          }
          check_file() {
            desc="$1"
            file="$2"
            if [ ! -f "$file" ]; then
              echo "::error::$desc"
              echo "file: $file"
              echo "reason: required file is absent"
              exit 1
            fi
            echo "[PASS] $desc"
          }
          check_absent() {
            desc="$1"
            pattern="$2"
            file="$3"
            if grep -Eq -- "$pattern" "$file"; then
              echo "::error::$desc"
              echo "pattern: $pattern"
              echo "file: $file"
              echo "reason: prohibited content is present"
              exit 1
            fi
            echo "[PASS] $desc"
          }
          check_fixed 'R18 Ethernet mapping' '"1:lan:1" "3:lan:2" "4:wan" "6@eth0"' "$network"
          check_file 'r18-net-rescue' "$rescue"
          check_file 'r18-net-rescue worker' "$worker"
          check_file 'R18 LuCI sysupgrade keep list' "$keep_luci"
          check_fixed '/etc/config/luci explicitly retained by keep-settings' '/etc/config/luci' "$keep_luci"
          check_file 'pinned Argon Makefile' "$argon"
          if [ -e openwrt/package/r18-luci-themes/luci-theme-liquid ]; then
            echo '::error::Liquid source directory must not be fetched for RC3'
            exit 1
          fi
          echo '[PASS] Liquid source directory is absent'
          check_fixed 'rescue START=99' 'START=99' "$rescue"
          check_fixed 'rescue procd enabled' 'USE_PROCD=1' "$rescue"
          check_fixed 'rescue delay = 180' 'sleep 180' "$worker"
          check_fixed 'Stage 4 2.4 GHz SSID' 'R18-OpenWrt' "$wifi"
          check_fixed 'Stage 4 5 GHz SSID' 'R18-OpenWrt-5G' "$wifi"
          check_fixed 'Stage 4 Wi-Fi LAN membership' 'wireless.$section.network=lan' "$wifi"
          check_fixed 'recovery image padding' 'IMAGE/recovery.bin := append-kernel | append-rootfs | pad-rootfs | r18-pad-to-ff $$(IMAGE_SIZE) | check-size' "$image"
          check_fixed 'r18 pad-to-FF image helper' 'define Build/r18-pad-to-ff' "$image"
          check_absent 'recovery image must not contain sysupgrade metadata' '^  IMAGE/recovery\.bin .*append-metadata' "$image"
          check_fixed 'compact metadata-verified sysupgrade image rule' 'IMAGE/sysupgrade.bin := append-kernel | append-rootfs | pad-rootfs | check-size | append-metadata' "$image"

      - name: Verify Stage 4 source defaults
        run: |
          set -eu
          rescue=openwrt/target/linux/ramips/mt76x8/base-files/etc/init.d/r18-net-rescue
          disable=openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/98-r18-net-rescue-disable
          defaults=openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/97-r18-stage3-defaults
          wifi=openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/99-r18-wifi-defaults
          health=openwrt/target/linux/ramips/mt76x8/base-files/usr/sbin/r18-healthcheck
          build_info=openwrt/target/linux/ramips/mt76x8/base-files/etc/r18-build-info
          keep_luci=openwrt/target/linux/ramips/mt76x8/base-files/lib/upgrade/keep.d/r18-luci
          for file in "$rescue" "$disable" "$defaults" "$wifi" "$health" "$build_info" "$keep_luci"; do
            test -f "$file" || { echo "::error::Missing Stage 4 file: $file"; exit 1; }
          done
          test -x "$rescue" || { echo "::error::r18-net-rescue is not executable"; exit 1; }
          test -x "$health" || { echo "::error::r18-healthcheck is not executable"; exit 1; }
          sh -n "$rescue"
          sh -n "$disable"
          sh -n "$defaults"
          sh -n "$wifi"
          sh -n "$health"
          sh scripts/test_r18_healthcheck_parser.sh "$health"
          sh scripts/test_r18_luci_keep_settings.sh "$keep_luci" "$defaults"
          grep -Fq '/etc/init.d/r18-net-rescue disable' "$disable" || {
            echo '::error::Stage 4 rescue disable hook is missing'
            exit 1
          }
          if grep -Fq 'S99r18-net-rescue' ../patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch; then
            echo '::error::Stage patch must not create an S99 r18-net-rescue link'
            exit 1
          fi
          python3 scripts/verify_r18_stage3.py \
            --stage-patch patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch \
            --generated-patch openwrt/target/linux/ramips/patches-6.12/935-mtd-spi-nor-spansion-s25fl128s1-256-byte-page.patch \
            --config configs/r18-initramfs.config \
            --upgrade-platform openwrt/target/linux/ramips/mt76x8/base-files/lib/upgrade/platform.sh \
            --theme-lock themes/r18-luci-themes.lock \
            --argon-package openwrt/package/r18-luci-themes/luci-theme-argon/Makefile
          echo '[PASS] Stage 4 RC3 defaults, themes, keep-settings, and healthcheck shell syntax'

      - name: Prepare build configuration
        working-directory: openwrt
        run: |
          set -eu
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "===== LuCI feed package search ====="
          for package in \
            luci-i18n-base-zh-cn \
            luci-app-firewall \
            luci-i18n-firewall-zh-cn \
            luci-app-package-manager \
            luci-i18n-package-manager-zh-cn
          do
            if ! result="$(./scripts/feeds search "$package")"; then
              echo "::error::LuCI feed search failed for $package"
              exit 1
            fi
            printf '%s\n' "$result"
            printf '%s\n' "$result" | grep -F "$package" >/dev/null || {
              echo "::error::LuCI feed package $package does not exist in OpenWrt v25.12.5"
              exit 1
            }
          done
          echo "===== End LuCI feed package search ====="
          cp ../configs/r18-initramfs.config .config
          # CCACHE is a hidden Kconfig prompt unless DEVEL is enabled. Set both
          # before defconfig, then assert the final persisted compiler setting.
          printf '%s\n' 'CONFIG_DEVEL=y' 'CONFIG_CCACHE=y' >> .config
          make defconfig
          grep -Fx 'CONFIG_CCACHE=y' .config || {
            echo '::error::CONFIG_CCACHE=y was dropped by make defconfig'
            exit 1
          }
          echo "===== LuCI config after defconfig ====="
          grep -E '^CONFIG_(PACKAGE_luci|LUCI_LANG_zh_Hans)|^# CONFIG_(PACKAGE_luci|LUCI_LANG_zh_Hans)' .config | \
            grep -E '(^CONFIG_PACKAGE_luci=y$|LUCI_LANG_zh_Hans|app-firewall|app-package-manager|base-zh-cn|firewall-zh-cn|package-manager-zh-cn)' || true
          echo "===== End LuCI config ====="
          require_luci_config() {
            if ! grep -Fx "$1" .config; then
              echo "::error::$2 was dropped by make defconfig"
              exit 1
            fi
          }
          require_luci_config 'CONFIG_LUCI_LANG_zh_Hans=y' 'LUCI_LANG_zh_Hans'
          require_luci_config 'CONFIG_PACKAGE_luci=y' 'luci'
          require_luci_config 'CONFIG_PACKAGE_luci-app-firewall=y' 'luci-app-firewall'
          require_luci_config 'CONFIG_PACKAGE_luci-app-package-manager=y' 'luci-app-package-manager'
          require_luci_config 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' 'luci-i18n-base-zh-cn'
          require_luci_config 'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y' 'luci-i18n-firewall-zh-cn'
          require_luci_config 'CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y' 'luci-i18n-package-manager-zh-cn'
          require_luci_config 'CONFIG_PACKAGE_luci-theme-bootstrap=y' 'luci-theme-bootstrap'
          require_luci_config 'CONFIG_PACKAGE_luci-theme-argon=y' 'luci-theme-argon'
          grep -Fx 'CONFIG_PACKAGE_luci-theme-liquid=y' .config && {
            echo '::error::luci-theme-liquid must not be selected for RC3'
            exit 1
          } || true
          echo '[PASS] Liquid absent'
          require_luci_config 'CONFIG_PACKAGE_kmod-mt76=y' 'kmod-mt76'
          require_luci_config 'CONFIG_PACKAGE_kmod-mt76-core=y' 'kmod-mt76-core'
          require_luci_config 'CONFIG_PACKAGE_kmod-mt76x2-common=y' 'kmod-mt76x2-common'
          require_luci_config 'CONFIG_PACKAGE_kmod-mt76x2=y' 'kmod-mt76x2 (contains mt76x2e)'
          grep -Fx 'CONFIG_PACKAGE_luci-app-argon-config=y' .config && {
            echo '::error::luci-app-argon-config must not be selected'
            exit 1
          } || true
          grep -Fx 'CONFIG_PACKAGE_wget-nossl=y' .config && {
            echo '::error::wget-nossl must not be selected by the theme build'
            exit 1
          } || true
          echo '[PASS] Argon Config and wget-nossl are absent'

      - name: Restore OpenWrt compiler cache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ${{ runner.os }}-openwrt-v25.12.5-r18-ccache-v1-${{ hashFiles('configs/r18-initramfs.config', 'patches/openwrt-25.12.5/**', 'themes/r18-luci-themes.lock') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-v25.12.5-r18-ccache-v1-

      - name: Inject private Stage 4 Wi-Fi PSK
        env:
          R18_WIFI_PSK: ${{ secrets.R18_WIFI_PSK }}
          R18_WIFI_TEST_PSK: ${{ secrets.R18_WIFI_TEST_PSK }}
        run: |
          psk="${R18_WIFI_PSK:-$R18_WIFI_TEST_PSK}"
          test -n "$psk" || { echo 'R18_WIFI_PSK or legacy R18_WIFI_TEST_PSK secret is required'; exit 1; }
          test "${#psk}" -ge 8 || { echo 'Stage 4 Wi-Fi PSK must be at least 8 characters'; exit 1; }
          install -d -m 0755 openwrt/files/etc
          umask 077
          printf '%s\n' "$psk" > openwrt/files/etc/r18-wifi-psk

      - name: Download OpenWrt sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)"

      - name: Verify Stage 2.4 SPI-NOR kernel patch
        run: |
          set -eu
          python3 scripts/verify_r18_stage24.py \
            --stage-patch patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch \
            --generated-patch openwrt/target/linux/ramips/patches-6.12/935-mtd-spi-nor-spansion-s25fl128s1-256-byte-page.patch \
            --kernel-tar openwrt/dl/linux-6.12.94.tar.xz

      - name: Verify Stage 4 source and no-fuzz kernel patch
        run: |
          set -eu
          python3 scripts/verify_r18_stage3.py \
            --stage-patch patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch \
            --generated-patch openwrt/target/linux/ramips/patches-6.12/935-mtd-spi-nor-spansion-s25fl128s1-256-byte-page.patch \
            --config configs/r18-initramfs.config \
            --upgrade-platform openwrt/target/linux/ramips/mt76x8/base-files/lib/upgrade/platform.sh \
            --theme-lock themes/r18-luci-themes.lock \
            --argon-package openwrt/package/r18-luci-themes/luci-theme-argon/Makefile \
            --kernel-tar openwrt/dl/linux-6.12.94.tar.xz

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          export CCACHE_DIR="$PWD/.ccache"
          echo "===== ccache status before build ====="
          ccache -z || true
          ccache -s || true
          make -j"$(nproc)" V=s 2>&1 | tee ../kernel-build.log
          echo "===== ccache status after build ====="
          ccache -s || true

      - name: Verify prepared S25FL128S1 kernel fixup
        run: |
          set -eu
          spansion=$(find openwrt/build_dir -type f -path '*/linux-ramips_mt76x8/linux-*/drivers/mtd/spi-nor/spansion.c' -print -quit)
          test -n "$spansion" || {
            echo '::error::Prepared Linux spansion.c was not found after the OpenWrt build'
            exit 1
          }
          python3 scripts/verify_r18_stage24.py \
            --stage-patch patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch \
            --generated-patch openwrt/target/linux/ramips/patches-6.12/935-mtd-spi-nor-spansion-s25fl128s1-256-byte-page.patch \
            --spansion "$spansion"

      - name: Verify recovery image
        run: |
          set -eu
          mkdir -p artifacts
          test -d openwrt/bin/targets || {
            echo '::error::OpenWrt build output directory does not exist'
            exit 1
          }
          initramfs=$(find openwrt/bin/targets -type f -iname '*meizu*r18*initramfs-kernel.bin' -print -quit)
          sysupgrade=$(find openwrt/bin/targets -type f -iname '*meizu*r18*squashfs-sysupgrade.bin' -print -quit)
          recovery=$(find openwrt/bin/targets -type f -iname '*meizu*r18*squashfs-recovery.bin' -print -quit)
          test -n "$initramfs" || { echo '::error::Missing R18 initramfs-kernel.bin'; exit 1; }
          test -n "$sysupgrade" || { echo '::error::Missing R18 squashfs-sysupgrade.bin'; exit 1; }
          test -n "$recovery" || { echo '::error::Missing R18 squashfs-recovery.bin'; exit 1; }
          echo '[PASS] required R18 images exist'
          test "$(stat -c%s "$sysupgrade")" -lt 15728640 || {
            echo '::error::R18 sysupgrade must remain a compact image, not a full firmware recovery image'
            exit 1
          }
          echo '[PASS] sysupgrade remains compact'
          fwtool=openwrt/staging_dir/host/bin/fwtool
          test -x "$fwtool" || {
            echo "::error::OpenWrt fwtool is missing: $fwtool"
            exit 1
          }
          sysupgrade_metadata=$(mktemp)
          trap 'rm -f "$sysupgrade_metadata"' EXIT
          "$fwtool" -i "$sysupgrade_metadata" "$sysupgrade" || {
            echo '::error::R18 sysupgrade metadata could not be extracted'
            exit 1
          }
          grep -Fq 'meizu,r18' "$sysupgrade_metadata" || {
            echo '::error::R18 sysupgrade metadata does not identify meizu,r18'
            exit 1
          }
          echo '[PASS] sysupgrade metadata identifies meizu,r18'
          python3 scripts/verify_r18_recovery.py "$recovery"
          cp "$initramfs" "$sysupgrade" "$recovery" artifacts/
          cp "$recovery" artifacts/meizu_r18.bin
          cmp -s "$recovery" artifacts/meizu_r18.bin || {
            echo '::error::meizu_r18.bin is not an exact copy of squashfs-recovery.bin'
            exit 1
          }
          recovery_sha=$(sha256sum "$recovery" | awk '{print $1}')
          candidate_sha=$(sha256sum artifacts/meizu_r18.bin | awk '{print $1}')
          test "$recovery_sha" = "$candidate_sha" || {
            echo '::error::meizu_r18.bin checksum differs from squashfs-recovery.bin'
            exit 1
          }
          echo '[PASS] meizu_r18.bin exactly matches recovery image'
          cp kernel-build.log artifacts/kernel-build.log || true
          python3 scripts/verify_r18_stage3.py \
            --stage-patch patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch \
            --generated-patch openwrt/target/linux/ramips/patches-6.12/935-mtd-spi-nor-spansion-s25fl128s1-256-byte-page.patch \
            --config configs/r18-initramfs.config \
            --upgrade-platform openwrt/target/linux/ramips/mt76x8/base-files/lib/upgrade/platform.sh \
            --theme-lock themes/r18-luci-themes.lock \
            --argon-package openwrt/package/r18-luci-themes/luci-theme-argon/Makefile \
            --recovery "$recovery"
          python3 - "$recovery" "$sysupgrade" <<'PY' > artifacts/IMAGE-SIZES.txt
          import struct
          import sys
          from pathlib import Path

          recovery = Path(sys.argv[1])
          sysupgrade = Path(sys.argv[2])
          with recovery.open('rb') as image:
              header = image.read(64)
              kernel_size = 64 + struct.unpack_from('>I', header, 12)[0]
              image.seek(kernel_size)
              superblock = image.read(48)
              squashfs_bytes_used = struct.unpack_from('<Q', superblock, 40)[0]
          rootfs_data_offset = (kernel_size + squashfs_bytes_used + 0xffff) & ~0xffff
          stage35_kernel = 1951334
          stage35_squashfs = 4608806
          stage35_sysupgrade = 6619407
          print(f'kernel bytes: {kernel_size}')
          print(f'squashfs bytes_used: {squashfs_bytes_used}')
          print(f'sysupgrade bytes: {sysupgrade.stat().st_size}')
          print(f'recovery bytes: {recovery.stat().st_size}')
          print(f'rootfs_data offset: 0x{rootfs_data_offset:08x}')
          print('Stage 3.5 baseline kernel bytes: 1951334')
          print('Stage 3.5 baseline squashfs bytes_used: 4608806')
          print('Stage 3.5 baseline sysupgrade bytes: 6619407')
          print(f'theme delta kernel bytes: {kernel_size - stage35_kernel:+d}')
          print(f'theme delta squashfs bytes_used: {squashfs_bytes_used - stage35_squashfs:+d}')
          print(f'theme delta sysupgrade bytes: {sysupgrade.stat().st_size - stage35_sysupgrade:+d}')
          PY
          cat artifacts/IMAGE-SIZES.txt
          printf '%s\n' 'Meizu R18 OpenWrt 25.12.5 Release Candidate 3: explicitly retains /etc/config/luci for keep-settings sysupgrade, while clean sysupgrade uses LuCI Bootstrap. Argon remains an optional pinned theme. Recovery, LAN1/LAN2, dual-band Wi-Fi, LuCI, JFFS2, and the S25FL128S1 fix are hardware-tested. WAN P4 upstream DHCP / Internet physical validation remains pending.' > artifacts/RELEASE-CANDIDATE.txt
          cat > artifacts/README-FIRST.txt <<'EOF'
          Meizu R18 OpenWrt 25.12.5 Release Candidate 3

          Normal OpenWrt upgrade: use *-squashfs-sysupgrade.bin and run sysupgrade -T first.
          First install or recovery: use meizu_r18.bin with the documented WPS/TFTP procedure.
          Keep-settings sysupgrade explicitly retains /etc/config/luci; clean sysupgrade uses LuCI Bootstrap. WAN P4 upstream DHCP / Internet validation is pending.
          EOF

      - name: Generate build metadata
        run: |
          set -eu
          test -d artifacts || {
            echo '::error::artifact directory is missing after recovery verification'
            exit 1
          }
          (
            cd artifacts
            sha256sum -- *.bin > SHA256SUMS
          )
          {
            echo 'Project: Meizu R18 OpenWrt'
            echo 'Stage: 4 - Release Candidate 3 (v0.4.0-rc3)'
            echo 'OpenWrt: 25.12.5'
            echo 'Kernel: 6.12.94'
            echo 'Target: ramips/mt76x8'
            echo 'Device: meizu_r18'
            echo "Git commit: ${GITHUB_SHA}"
            echo "Git branch: ${GITHUB_REF_NAME}"
            echo "GitHub Actions run: ${GITHUB_RUN_NUMBER} / ${GITHUB_RUN_ID}"
            echo "Build time UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo 'SPI NOR:'
            echo '  part: s25fl128s1'
            echo '  JEDEC: 01 20 18 4d 01 80'
            echo '  page size fix: 256 bytes (Stage 2.4, hardware validated)'
            echo
            echo 'Network rescue:'
            echo '  autostart: disabled'
            echo '  manual service: retained'
            echo
            echo 'LuCI themes:'
            echo '  default clean-install theme: Bootstrap'
            echo '  keep-settings LuCI config: /etc/config/luci'
            echo '  installed themes: Bootstrap, Argon'
            echo '  Argon source: https://github.com/jerrykuku/luci-theme-argon.git'
            echo '  Argon pin: 86c3156bab0ee2b8c91af68b3fa4655f2df51d09'
            echo
            echo 'Recovery:'
            echo '  expected size: 15728640'
            echo '  firmware range: 0x050000-0xF50000'
            echo '  rootfs_data marker: DE AD C0 DE'
            echo '  FF suffix verification: PASS'
            echo
            echo 'Image sizes:'
            cat artifacts/IMAGE-SIZES.txt
            echo
            echo 'Reference hardware validation status:'
            echo '  Stage 2.4 SPI-NOR/JFFS2 validation: PASS'
            echo '  Stage 3.5 keep-settings sysupgrade: PASS'
            echo '  Stage 3.5 clean sysupgrade: PASS'
