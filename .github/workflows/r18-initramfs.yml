name: Meizu R18 Stage 2.4 - Fix S25FL128S1 256-byte page programming

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/r18-initramfs.config'
      - 'patches/openwrt-25.12.5/**'
      - 'scripts/verify_r18_recovery.py'
      - '.github/workflows/r18-initramfs.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            ccache gcc-multilib gettext git libncurses5-dev libssl-dev python3 \
            python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt v25.12.5 and apply R18 board patch
        run: |
          git clone --depth 1 --branch v25.12.5 https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt apply --check ../patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch
          git -C openwrt apply ../patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch
          git -C openwrt diff --check

      - name: Restore OpenWrt ccache and downloads
        uses: actions/cache@v4
        with:
          path: |
            openwrt/.ccache
            openwrt/dl
          key: ${{ runner.os }}-openwrt-v25.12.5-r18-ccache-dl-v1-${{ hashFiles('configs/r18-initramfs.config', 'patches/openwrt-25.12.5/**') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-v25.12.5-r18-ccache-dl-v1-

      - name: Check Stage 2.4 source assertions
        run: |
          set -eu
          network=openwrt/target/linux/ramips/mt76x8/base-files/etc/board.d/02_network
          rescue=openwrt/target/linux/ramips/mt76x8/base-files/etc/init.d/r18-net-rescue
          worker=openwrt/target/linux/ramips/mt76x8/base-files/usr/sbin/r18-net-rescue-worker
          image=openwrt/target/linux/ramips/image/mt76x8.mk
          stage_patch=patches/openwrt-25.12.5/0001-ramips-add-meizu-r18-stage2.patch
          spi_nor_patch=openwrt/target/linux/ramips/patches-6.12/935-mtd-spi-nor-spansion-s25fl128s1-256-byte-page.patch
          check_fixed() {
            desc="$1"
            pattern="$2"
            file="$3"
            if ! grep -Fq -- "$pattern" "$file"; then
              echo "::error::$desc"
              echo "pattern: $pattern"
              echo "file: $file"
              exit 1
            fi
          }
          grep -A5 -F 'meizu,r18)' "$network" | grep -F '"1:lan:1" "3:lan:2" "4:wan" "6@eth0"'
          test -f "$rescue"
          test -f "$worker"
          grep -F 'START=99' "$rescue"
          grep -F 'USE_PROCD=1' "$rescue"
          grep -F 'sleep 180' "$worker"
          grep -F 'R18-OpenWrt-Test' openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/99-r18-wifi-test
          grep -F "network='lan'" openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/99-r18-wifi-test
          grep -F "luci.main.lang='zh_cn'" openwrt/target/linux/ramips/mt76x8/base-files/etc/uci-defaults/99-r18-wifi-test
          grep -F 'IMAGE/recovery.bin := append-kernel | append-rootfs | pad-rootfs | r18-pad-to-ff $$(IMAGE_SIZE) | check-size' "$image"
          grep -F 'define Build/r18-pad-to-ff' "$image"
          ! grep -E '^  IMAGE/recovery\.bin .*append-metadata' "$image"
          grep -F 'IMAGE/sysupgrade.bin := append-kernel | append-rootfs | pad-rootfs | check-size' "$image"
          test -f "$stage_patch" || {
            echo "::error::missing managed Stage patch: $stage_patch"
            exit 1
          }
          check_fixed 'managed Stage patch does not inject the Stage 2.4 935 kernel patch' 'diff --git a/target/linux/ramips/patches-6.12/935-mtd-spi-nor-spansion-s25fl128s1-256-byte-page.patch' "$stage_patch"
          test -f "$spi_nor_patch" || {
            echo "::error::missing expected Stage 2.4 kernel patch: $spi_nor_patch"
            exit 1
          }
          check_fixed 'generated 935 patch is missing the dedicated S25FL128S1 post-BFPT fixup' 's25fl128s1_post_bfpt_fixups' "$spi_nor_patch"
          check_fixed 'generated 935 patch is missing the S25FL128S1 256-byte page size assignment' 'nor->params->page_size = 256;' "$spi_nor_patch"
          check_fixed 'generated 935 patch is missing the S25FL128S1 flash-info entry context' '.name = "s25fl128s1",' "$spi_nor_patch"
          check_fixed 'generated 935 patch is missing the dedicated S25FL128S1 fixup binding' '.fixups = &s25fl128s1_fixups,' "$spi_nor_patch"
          if grep -Fq -- '.fixups = &s25fs_s_nor_fixups,' "$spi_nor_patch"; then
            echo "::error::Stage 2.4 must not bind S25FL128S1 to s25fs_s_nor_fixups"
            exit 1
          fi

      - name: Configure feeds and Stage 2.4 initramfs
        working-directory: openwrt
        run: |
          set -eu
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "===== LuCI feed package search ====="
          for package in \
            luci-i18n-base-zh-cn \
            luci-app-firewall \
            luci-i18n-firewall-zh-cn \
            luci-app-package-manager \
            luci-i18n-package-manager-zh-cn
          do
            if ! result="$(./scripts/feeds search "$package")"; then
              echo "::error::LuCI feed search failed for $package"
              exit 1
            fi
            printf '%s\n' "$result"
            printf '%s\n' "$result" | grep -F "$package" >/dev/null || {
              echo "::error::LuCI feed package $package does not exist in OpenWrt v25.12.5"
              exit 1
            }
          done
          echo "===== End LuCI feed package search ====="
          cp ../configs/r18-initramfs.config .config
          # CCACHE is a hidden Kconfig prompt unless DEVEL is enabled. Set both
          # before defconfig, then assert the final persisted compiler setting.
          printf '%s\n' 'CONFIG_DEVEL=y' 'CONFIG_CCACHE=y' >> .config
          make defconfig
          grep -Fx 'CONFIG_CCACHE=y' .config || {
            echo '::error::CONFIG_CCACHE=y was dropped by make defconfig'
            exit 1
          }
          echo "===== LuCI config after defconfig ====="
          grep -E '^CONFIG_(PACKAGE_luci|LUCI_LANG_zh_Hans)|^# CONFIG_(PACKAGE_luci|LUCI_LANG_zh_Hans)' .config | \
            grep -E '(^CONFIG_PACKAGE_luci=y$|LUCI_LANG_zh_Hans|app-firewall|app-package-manager|base-zh-cn|firewall-zh-cn|package-manager-zh-cn)' || true
          echo "===== End LuCI config ====="
          require_luci_config() {
            if ! grep -Fx "$1" .config; then
              echo "::error::$2 was dropped by make defconfig"
              exit 1
            fi
          }
          require_luci_config 'CONFIG_LUCI_LANG_zh_Hans=y' 'LUCI_LANG_zh_Hans'
          require_luci_config 'CONFIG_PACKAGE_luci=y' 'luci'
          require_luci_config 'CONFIG_PACKAGE_luci-app-firewall=y' 'luci-app-firewall'
          require_luci_config 'CONFIG_PACKAGE_luci-app-package-manager=y' 'luci-app-package-manager'
          require_luci_config 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' 'luci-i18n-base-zh-cn'
          require_luci_config 'CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y' 'luci-i18n-firewall-zh-cn'
          require_luci_config 'CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y' 'luci-i18n-package-manager-zh-cn'

      - name: Inject private 2.4 GHz test PSK
        env:
          R18_WIFI_TEST_PSK: ${{ secrets.R18_WIFI_TEST_PSK }}
        run: |
          test -n "$R18_WIFI_TEST_PSK" || { echo 'R18_WIFI_TEST_PSK secret is required'; exit 1; }
          test "${#R18_WIFI_TEST_PSK}" -ge 8 || { echo 'R18_WIFI_TEST_PSK must be at least 8 characters'; exit 1; }
          install -d -m 0755 openwrt/files/etc
          umask 077
          printf '%s\n' "$R18_WIFI_TEST_PSK" > openwrt/files/etc/r18-wifi-test-psk

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)"

      - name: Build
        working-directory: openwrt
        run: |
          set -euo pipefail
          export CCACHE_DIR="$PWD/.ccache"
          echo "===== ccache status before build ====="
          ccache -z || true
          ccache -s || true
          make -j"$(nproc)" V=s 2>&1 | tee ../kernel-build.log
          echo "===== ccache status after build ====="
          ccache -s || true

      - name: Verify prepared S25FL128S1 kernel fixup
        run: |
          set -eu
          spansion=$(find openwrt/build_dir -type f -path '*/linux-ramips_mt76x8/linux-*/drivers/mtd/spi-nor/spansion.c' -print -quit)
          test -n "$spansion" || {
            echo '::error::Prepared Linux spansion.c was not found after the OpenWrt build'
            exit 1
          }
          require_kernel_literal() {
            if ! grep -Fq -- "$1" "$spansion"; then
              echo "::error::missing expected applied S25FL128S1 kernel content: $2"
              exit 1
            fi
          }
          require_kernel_literal 's25fl128s1_post_bfpt_fixups' 'dedicated post-BFPT fixup'
          require_kernel_literal 'nor->params->page_size = 256;' '256-byte page size assignment'
          s25fl128s1_entry=$(sed -n '/SNOR_ID(0x01, 0x20, 0x18, 0x4d, 0x01, 0x80)/,/^[[:space:]]*}, {[[:space:]]*$/p' "$spansion")
          test -n "$s25fl128s1_entry" || {
            echo '::error::S25FL128S1 JEDEC 01 20 18 4d 01 80 entry was not found in applied spansion.c'
            exit 1
          }
          printf '%s\n' "$s25fl128s1_entry" | grep -Fq -- '.name = "s25fl128s1",' || {
            echo '::error::JEDEC 01 20 18 4d 01 80 is not the s25fl128s1 entry'
            exit 1
          }
          printf '%s\n' "$s25fl128s1_entry" | grep -Fq -- '.fixups = &s25fl128s1_fixups,' || {
            echo '::error::JEDEC 01 20 18 4d 01 80 is missing the dedicated S25FL128S1 fixup binding'
            exit 1
          }
          if printf '%s\n' "$s25fl128s1_entry" | grep -Fq -- '.fixups = &s25fs_s_nor_fixups,'; then
            echo '::error::JEDEC 01 20 18 4d 01 80 must not use s25fs_s_nor_fixups'
            exit 1
          fi

      - name: Verify images and create checksums
        if: always()
        run: |
          set -eu
          mkdir -p artifacts
          test -d openwrt/bin/targets || {
            echo '::error::OpenWrt build output directory does not exist'
            exit 1
          }
          initramfs=$(find openwrt/bin/targets -type f -iname '*meizu*r18*initramfs-kernel.bin' -print -quit)
          sysupgrade=$(find openwrt/bin/targets -type f -iname '*meizu*r18*squashfs-sysupgrade.bin' -print -quit)
          recovery=$(find openwrt/bin/targets -type f -iname '*meizu*r18*squashfs-recovery.bin' -print -quit)
          test -n "$initramfs" || { echo '::error::Missing R18 initramfs-kernel.bin'; exit 1; }
          test -n "$sysupgrade" || { echo '::error::Missing R18 squashfs-sysupgrade.bin'; exit 1; }
          test -n "$recovery" || { echo '::error::Missing R18 squashfs-recovery.bin'; exit 1; }
          test "$(stat -c%s "$sysupgrade")" -lt 15728640 || {
            echo '::error::R18 sysupgrade must remain a compact image, not a full firmware recovery image'
            exit 1
          }
          python3 scripts/verify_r18_recovery.py "$recovery"
          cp "$initramfs" "$sysupgrade" "$recovery" artifacts/
          cp "$recovery" artifacts/meizu_r18.bin
          cmp -s "$recovery" artifacts/meizu_r18.bin || {
            echo '::error::meizu_r18.bin is not an exact copy of squashfs-recovery.bin'
            exit 1
          }
          test "$(sha256sum "$recovery" | awk '{print $1}')" = "$(sha256sum artifacts/meizu_r18.bin | awk '{print $1}')"
          cp openwrt/.config artifacts/.config || true
          cp kernel-build.log artifacts/kernel-build.log || true
          printf '%s\n' 'Stage 2.4 - Fix S25FL128S1 256-byte page programming: meizu_r18.bin is a full-firmware static recovery candidate only; hardware validation is required before any WPS/TFTP recovery or flash operation.' > artifacts/NOT-FOR-FLASHING.txt
          cd artifacts
          sha256sum * .config > sha256sums 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meizu-r18-stage2.4-s25fl128s1-page-size-fix
          path: artifacts/
